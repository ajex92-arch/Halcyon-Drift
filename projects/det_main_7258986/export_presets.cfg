; Export presets for Halcyon Drift (Godot 4.7). Used by the release workflow
; (.github/workflows/release.yml), which exports both presets headless:
;   godot --headless --path remake --export-release "Windows Desktop" <out>/HalcyonDrift.exe
;   godot --headless --path remake --export-release "Web" <out>/index.html
; Options left out here keep Godot's defaults.
;
; Both presets leave out the test scripts, the documentation and the helper
; tools: they are not part of the game. (The tests are only loaded when the
; game is started with --test=<name>, which a player never does.)

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, docs/*, tools/*"
export_path="../build/windows/HalcyonDrift.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; No separate console wrapper exe: the build is one HalcyonDrift.exe.
debug/export_console_wrapper=0
; Embed the game data (the .pck) in the exe: one file to download and run.
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
; Editing the exe's icon and version info needs rcedit (and wine on Linux),
; which the Linux build runner does not have: keep this off or the export fails.
application/modify_resources=false
application/product_name="Halcyon Drift"
application/file_description="Halcyon Drift"
application/export_angle=0
application/export_d3d12=0

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, docs/*, tools/*"
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; Single-threaded web build: no SharedArrayBuffer, so it needs no special
; (cross-origin isolation) server headers and runs on GitHub Pages as is.
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
; Adaptive: the game canvas follows the size of the browser window.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
